<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181520"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>

    <!-- Flame / Energy Gradient -->
    <linearGradient id="flameGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="45%" stop-color="#FF522B"/>
      <stop offset="100%" stop-color="#E01A6A"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Optical Viewfinder Reticle (Corner Brackets) -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Left -->
    <path d="M 25 38 L 25 30 A 5 5 0 0 1 30 25 L 38 25" />
    <!-- Top Right -->
    <path d="M 82 25 L 90 25 A 5 5 0 0 1 95 30 L 95 38" />
    <!-- Bottom Left -->
    <path d="M 25 82 L 25 90 A 5 5 0 0 0 30 95 L 38 95" />
    <!-- Bottom Right -->
    <path d="M 82 95 L 90 95 A 5 5 0 0 0 95 90 L 95 82" />
  </g>

  <!-- Center Nutrition Calorie / Energy Flame Mark -->
  <!-- Ambient Core Glow -->
  <circle cx="60" cy="62" r="16" fill="url(#flameGrad)" opacity="0.25" filter="url(#subtleGlow)"/>

  <!-- Primary Outer Flame -->
  <path d="M 60 33
           C 60 33, 79 50, 79 66
           C 79 77.5, 70.8 86, 60 86
           C 49.2 86, 41 77.5, 41 66
           C 41 53, 52 42, 54 39
           C 54.5 44, 57 48, 62 49
           C 60 45, 59 40, 60 33 Z"
        fill="url(#flameGrad)"/>

  <!-- Inner Radiant Spark / Seed -->
  <path d="M 60 56
           C 60 56, 68 64, 68 71
           C 68 76, 64.5 79.5, 60 79.5
           C 55.5 79.5, 52 76, 52 71
           C 52 65, 57 60, 60 56 Z"
        fill="url(#coreGrad)"/>
</svg>
